<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ваш подарок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(180deg, #0a192f 0%, #112240 100%);
        color: #e6f1ff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 20px;
        background: rgba(17, 34, 64, 0.9);
        border-bottom: 1px solid #1e3a5f;
    }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #0088ff; object-fit: cover; }
    .user-details h2 { font-size: 14px; margin: 0; }
    .user-details p { font-size: 11px; color: #64ffda; margin: 0; }
    .star-balance { background: rgba(30, 58, 95, 0.8); padding: 6px 14px; border-radius: 20px; border: 1px solid #0088ff; font-weight: bold; color: #64ffda; }

    .content {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 24px; text-align: center;
    }
    .gift-image {
        width: 220px; height: 220px;
        border-radius: 20px; object-fit: cover;
        border: 3px solid #00d4ff;
        box-shadow: 0 0 40px rgba(0, 212, 255, 0.5);
        margin-bottom: 25px;
    }
    .success-title {
        font-size: 22px; font-weight: 800; color: #00d4ff;
        margin-bottom: 10px; text-shadow: 0 0 15px rgba(0,212,255,0.6);
    }
    .success-price {
        font-size: 36px; font-weight: 900; color: #64ffda;
        margin-bottom: 20px;
    }
    .success-text {
        color: #b0c8e0; font-size: 14px; line-height: 1.5; max-width: 300px;
    }
    .btn {
        display: block; background: #0088ff; color: #fff;
        border: none; padding: 15px 40px; border-radius: 30px;
        font-size: 16px; font-weight: 700; margin-top: 30px;
        width: 100%; max-width: 280px; cursor: pointer;
        box-shadow: 0 0 20px rgba(0,136,255,0.5);
    }
</style>
</head>
<body>
    <div class="header">
        <div class="user-info">
            <img id="userAvatar" class="avatar" src="">
            <div class="user-details">
                <h2 id="userName">Загрузка...</h2>
                <p id="userTag">@username</p>
            </div>
        </div>
        <div class="star-balance">⭐ <span id="userBalance">0</span></div>
    </div>

    <div class="content">
        <img id="giftImage" class="gift-image" src="https://via.placeholder.com/220?text=Подарок" alt="Подарок">
        <div class="success-title">Ваш купленный подарок</div>
        <div class="success-price" id="dealPrice">0 звёзд</div>
        <div class="success-text">
            После передачи подарка <b id="dealLink" style="color:#64ffda;"></b> продавцу, звёзды будут зачислены на ваш аккаунт.
        </div>
        <button class="btn" onclick="tg.close()">Понятно</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userName').textContent = user.first_name || 'Покупатель';
            document.getElementById('userTag').textContent = user.username ? '@' + user.username : '';
            if (user.photo_url) document.getElementById('userAvatar').src = user.photo_url;
        }

        const params = new URLSearchParams(window.location.search);
        const price = params.get('price') || '0';
        const gift = params.get('gift') || 'подарок';
        const img = params.get('img') || '';

        document.getElementById('userBalance').textContent = price;
        document.getElementById('dealPrice').textContent = price + ' звёзд';
        document.getElementById('dealLink').textContent = gift;
        if (img) document.getElementById('giftImage').src = img;
    </script>
</body>
</html>
