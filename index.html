<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой Профиль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f0f17;
        color: #e8e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
    }
    .card {
        background: #1a1a28;
        border-radius: 20px;
        padding: 32px 28px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 12px 40px rgba(0,0,0,0.55);
        text-align: center;
        border: 1px solid #2a2a3d;
    }
    .avatar {
        width: 80px; height: 80px; margin: 0 auto 15px;
        background: #22223a; border-radius: 50%;
        border: 2px solid #e94560; display: flex;
        align-items: center; justify-content: center; font-size: 32px;
    }
    h1 { font-size: 20px; margin: 0 0 5px; color: #e94560; }
    .username { color: #888; font-size: 14px; margin-bottom: 20px; }
    .balance-box {
        background: #22223a; border-radius: 12px; padding: 15px; margin-bottom: 20px;
        border: 1px solid #2a2a3d;
    }
    .balance-title { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
    .balance-value { font-size: 28px; font-weight: bold; color: #53a8b6; }
    .deal-card {
        background: #22223a; border-radius: 12px; padding: 15px; text-align: left;
        border-left: 4px solid #e94560; margin-bottom: 15px;
    }
    .deal-title { font-weight: bold; font-size: 15px; margin-bottom: 5px; }
    .deal-text { font-size: 13px; color: #b8b8c8; margin-bottom: 10px; }
    .deal-link { color: #53a8b6; word-break: break-all; text-decoration: none; }
    .btn {
        display: block; background: #e94560; color: #fff;
        border: none; padding: 15px; border-radius: 30px;
        font-size: 16px; font-weight: 700; margin-top: 10px;
        width: 100%; cursor: pointer; text-decoration: none;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="avatar">👤</div>
        <h1 id="userName">Загрузка...</h1>
        <div class="username" id="userNameTag">@username</div>
        
        <div class="balance-box">
            <div class="balance-title">Ваш баланс</div>
            <div class="balance-value" id="userBalance">0 звёзд</div>
        </div>

        <div id="dealContainer" style="display:none;">
            <div class="deal-card">
                <div class="deal-title">📦 Ваш подарок продан</div>
                <div class="deal-text">Сумма: <b id="dealPrice">0</b> звёзд</div>
                <div class="deal-text">Ссылка: <a href="#" class="deal-link" id="dealLink">...</a></div>
            </div>
            <a class="btn" id="actionBtn" href="#">Отправить подарок продавцу</a>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const price = params.get('price') || '0';
        const giftLink = params.get('gift') || '';
        const targetUser = params.get('to') || '';
        
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userName').textContent = user.first_name || 'Пользователь';
            if (user.username) {
                document.getElementById('userNameTag').textContent = '@' + user.username;
            } else {
                document.getElementById('userNameTag').textContent = 'ID: ' + user.id;
            }
        }

        if (price > 0 && giftLink) {
            document.getElementById('userBalance').textContent = price + ' звёзд (Ожидает)';
            document.getElementById('dealContainer').style.display = 'block';
            document.getElementById('dealPrice').textContent = price;
            
            const linkEl = document.getElementById('dealLink');
            linkEl.href = giftLink;
            linkEl.textContent = giftLink;

            const actionBtn = document.getElementById('actionBtn');
            // Кнопка отправки подарка продавцу
            actionBtn.href = 'https://t.me/' + targetUser.replace('@', ''); 
            actionBtn.textContent = 'Отправить подарок ' + targetUser;
        }
    </script>
</body>
