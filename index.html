<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(circle at top, #1a3a6b 0%, #0a192f 70%);
        color: #e6f1ff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    
    /* Экран анимации */
    #splash {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, #1a3a6b 0%, #0a192f 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 1000; transition: opacity 0.6s ease;
    }
    .plane-icon {
        width: 80px; height: 80px; color: #64ffda;
        filter: drop-shadow(0 0 20px rgba(100, 255, 218, 0.8));
        animation: flyIn 1.5s ease-out forwards; opacity: 0;
    }
    @keyframes flyIn {
        0% { transform: translate(-100px, 50px) rotate(-45deg); opacity: 0; }
        100% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    }
    .logo-text {
        font-size: 42px; font-weight: 900; color: #0088ff;
        margin-top: 20px; letter-spacing: 4px;
        text-shadow: 0 0 30px rgba(0, 136, 255, 0.6);
        display: flex; gap: 2px;
    }
    .logo-text span { opacity: 0; animation: appear 0.3s ease forwards; }
    @keyframes appear {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    /* Главное меню */
    #main-app { display: none; flex-direction: column; height: 100vh; opacity: 0; transition: opacity 0.5s ease; }
    #main-app.visible { opacity: 1; }

    .top-panel {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 20px; background: rgba(17, 34, 64, 0.85);
        backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 136, 255, 0.3);
    }
    .profile-mini { display: flex; align-items: center; gap: 10px; }
    .avatar {
        width: 42px; height: 42px; border-radius: 50%;
        background: #1e3a5f; border: 2px solid #0088ff;
        object-fit: cover; box-shadow: 0 0 15px rgba(0, 136, 255, 0.5);
    }
    .profile-mini h3 { font-size: 14px; color: #fff; margin: 0; }
    .profile-mini p { font-size: 11px; color: #64ffda; margin: 0; }
    
    .stars-badge {
        background: rgba(30, 58, 95, 0.8); padding: 8px 16px;
        border-radius: 20px; border: 1px solid #0088ff;
        font-weight: bold; font-size: 16px; color: #64ffda;
        box-shadow: 0 0 20px rgba(0, 136, 255, 0.4);
        cursor: pointer; transition: transform 0.2s;
    }
    .stars-badge:hover { transform: scale(1.05); }

    /* Онлайн */
    .online-bar {
        margin: 15px 20px; background: linear-gradient(90deg, #112240, #1e3a5f);
        padding: 12px 20px; border-radius: 12px;
        display: flex; justify-content: space-between; align-items: center;
        border: 1px solid rgba(0, 136, 255, 0.3);
        box-shadow: 0 0 20px rgba(0, 136, 255, 0.1);
    }
    .online-left { display: flex; align-items: center; gap: 8px; color: #64ffda; font-size: 13px; font-weight: 600; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 10px #00ff88; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .online-count { font-size: 15px; font-weight: 800; color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.6); }

    /* Контент */
    .content { flex: 1; padding: 0 20px 20px; overflow-y: auto; }
    h2 { font-size: 18px; color: #00d4ff; margin-bottom: 12px; }

    .deal-card {
        background: rgba(30, 58, 95, 0.4); border-radius: 12px; padding: 12px;
        border-left: 4px solid #00d4ff; margin-bottom: 10px;
        display: flex; gap: 12px; align-items: center;
    }
    .deal-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
    .deal-info { flex: 1; }
    .deal-title { font-size: 13px; font-weight: 600; color: #fff; }
    .deal-price { color: #64ffda; font-size: 15px; font-weight: bold; }
    .deal-date { font-size: 10px; color: #64a0c8; }
    .empty-text { color: #64a0c8; text-align: center; margin-top: 20px; }

    /* Нижнее меню */
    .bottom-nav {
        display: flex; justify-content: space-around; align-items: center;
        padding: 12px 0; background: rgba(17, 34, 64, 0.95);
        border-top: 1px solid rgba(0, 136, 255, 0.3); backdrop-filter: blur(10px);
    }
    .nav-item {
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        color: #64a0c8; font-size: 11px; cursor: pointer;
        transition: color 0.3s; padding: 5px 15px; border-radius: 10px;
    }
    .nav-item:hover, .nav-item.active { color: #64ffda; background: rgba(0, 136, 255, 0.1); }
    .nav-item .nav-icon { font-size: 20px; }

    /* Модальное окно вывода */
    .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
        z-index: 2000; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    
    .modal {
        background: #112240; border-radius: 20px; padding: 30px 25px;
        width: 90%; max-width: 340px; text-align: center;
        border: 1px solid #0088ff;
        box-shadow: 0 0 40px rgba(0, 136, 255, 0.5);
        animation: popIn 0.3s ease;
    }
    @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    
    .modal h3 { color: #00d4ff; margin-bottom: 20px; font-size: 18px; }
    
    .modal input {
        width: 100%; background: #0a192f; border: 1px solid #0088ff;
        border-radius: 10px; padding: 15px; font-size: 18px; color: #64ffda;
        text-align: center; margin-bottom: 15px; outline: none;
    }
    .modal input:focus { border-color: #64ffda; box-shadow: 0 0 15px rgba(100, 255, 218, 0.5); }
    
    .modal button {
        width: 100%; background: #0088ff; color: #fff; border: none;
        padding: 15px; border-radius: 10px; font-size: 16px;
        font-weight: 700; cursor: pointer; margin-bottom: 10px;
    }
    .modal button:hover { background: #00a0ff; }
    
    .modal .cancel {
        background: transparent; color: #64a0c8; border: 1px solid #1e3a5f;
    }
</style>
</head>
<body>

    <!-- Анимация -->
    <div id="splash">
        <svg class="plane-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
        <div class="logo-text" id="logoText"></div>
    </div>

    <!-- Меню -->
    <div id="main-app">
        <div class="top-panel">
            <div class="profile-mini">
                <img id="userAvatar" class="avatar" src="">
                <div>
                    <h3 id="userName">Загрузка...</h3>
                    <p id="userTag">@username</p>
                </div>
            </div>
            <div class="stars-badge" onclick="openWithdraw()">⭐ <span id="userBalance">0</span></div>
        </div>

        <div class="online-bar">
            <div class="online-left"><div class="online-dot"></div><span>Онлайн</span></div>
            <div class="online-count"><span id="onlineCount">0</span> 👤</div>
        </div>

        <div class="content">
            <h2>📦 Проданные подарки</h2>
            <div id="dealsList"><p class="empty-text">Загрузка...</p></div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item"><span class="nav-icon">👤</span><span>Профиль</span></div>
            <div class="nav-item active"><span class="nav-icon">🎁</span><span>Подарки</span></div>
            <div class="nav-item"><span class="nav-icon">🟢</span><span>Онлайн</span></div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="withdrawModal">
        <div class="modal">
            <h3>Сколько звёзд вы хотите вывести?</h3>
            <input type="number" id="withdrawAmount" placeholder="1000" min="1" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            <button onclick="submitWithdraw()">Вывести</button>
            <button class="cancel" onclick="closeWithdraw()">Отмена</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        // --- Анимация ---
        const logoText = document.getElementById('logoText');
        "Telegram".split('').forEach((char, i) => {
            const span = document.createElement('span');
            span.textContent = char;
            span.style.animationDelay = `${i * 0.1 + 0.5}s`;
            logoText.appendChild(span);
        });

        setTimeout(() => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                setTimeout(() => document.getElementById('main-app').classList.add('visible'), 50);
            }, 600);
        }, 2500);

        // --- Профиль ---
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userName').textContent = user.first_name || 'Пользователь';
            document.getElementById('userTag').textContent = user.username ? '@' + user.username : '';
            if (user.photo_url) document.getElementById('userAvatar').src = user.photo_url;
        }

        // --- Онлайн (живой, накрученный) ---
        let currentOnline = 0;
        const onlineEl = document.getElementById('onlineCount');

        function getBaseOnline() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 12) return 150 + Math.floor(Math.random() * 200);
            if (hour >= 12 && hour < 18) return 500 + Math.floor(Math.random() * 300);
            if (hour >= 18 && hour < 24) return 900 + Math.floor(Math.random() * 500);
            return 250 + Math.floor(Math.random() * 250);
        }

        currentOnline = getBaseOnline();
        onlineEl.textContent = currentOnline;

        // Каждые 5 секунд - крупный скачок (люди приходят/уходят)
        setInterval(() => {
            // Скачок: от -15 до +25 (видно, что люди приходят и уходят)
            const delta = Math.floor(Math.random() * 41) - 15;
            currentOnline += delta;
            
            // Ограничения по времени суток
            const hour = new Date().getHours();
            let min, max;
            if (hour >= 6 && hour < 12) { min = 100; max = 450; }
            else if (hour >= 12 && hour < 18) { min = 400; max = 900; }
            else if (hour >= 18 && hour < 24) { min = 800; max = 1600; }
            else { min = 200; max = 600; }

            if (currentOnline < min) currentOnline = min;
            if (currentOnline > max) currentOnline = max;

            // Анимация смены цифры
            onlineEl.style.opacity = '0.5';
            setTimeout(() => {
                onlineEl.textContent = currentOnline;
                onlineEl.style.opacity = '1';
            }, 150);
        }, 5000);

        // --- Проданные подарки ---
        const params = new URLSearchParams(window.location.search);
        const price = params.get('price');
        const gift = params.get('gift');
        const img = params.get('img');
        const dealsList = document.getElementById('dealsList');

        if (price && gift) {
            dealsList.innerHTML = `
                <div class="deal-card">
                    <img class="deal-img" src="${img || 'https://via.placeholder.com/50?text=🎁'}" alt="Подарок">
                    <div class="deal-info">
                        <div class="deal-title">Проданный подарок</div>
                        <div class="deal-price">${price} ⭐</div>
                        <div class="deal-date">${new Date().toLocaleDateString()}</div>
                    </div>
                </div>
            `;
        } else {
            dealsList.innerHTML = '<p class="empty-text">Пока нет проданных подарков.</p>';
        }

        // --- Вывод звёзд ---
        function openWithdraw() {
            document.getElementById('withdrawModal').classList.add('active');
            document.getElementById('withdrawAmount').value = '';
        }

        function closeWithdraw() {
            document.getElementById('withdrawModal').classList.remove('active');
        }

        function submitWithdraw() {
            const amount = document.getElementById('withdrawAmount').value;
            if (!amount || amount < 1) {
                alert('Введите сумму больше 0.');
                return;
            }
            
            // Закрываем модалку
            closeWithdraw();
            
            // Показываем уведомление
            tg.showAlert(`Звёзды поступят на баланс в течение 15 минут.\n\nЗапрошено: ${amount} ⭐`);
        }
    </script>
</body>
</html>
