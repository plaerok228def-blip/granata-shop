<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(180deg, #0a192f 0%, #112240 50%, #0a192f 100%);
        color: #e6f1ff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    /* Верхняя панель: Профиль слева, Звезды справа */
    .top-panel {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 20px;
        background: rgba(17, 34, 64, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #1e3a5f;
    }
    
    .profile-mini { display: flex; align-items: center; gap: 10px; }
    .avatar {
        width: 42px; height: 42px; border-radius: 50%;
        background: #1e3a5f; border: 2px solid #0088ff;
        object-fit: cover; box-shadow: 0 0 12px rgba(0, 136, 255, 0.5);
    }
    .profile-mini h3 { font-size: 14px; color: #fff; margin: 0; }
    .profile-mini p { font-size: 11px; color: #64ffda; margin: 0; }
    
    .stars-badge {
        background: rgba(30, 58, 95, 0.8); padding: 8px 15px;
        border-radius: 20px; border: 1px solid #0088ff;
        font-weight: bold; font-size: 15px; color: #64ffda;
        box-shadow: 0 0 15px rgba(0, 136, 255, 0.3);
    }

    /* Логотип Telegram по центру */
    .logo-section {
        text-align: center;
        padding: 30px 20px 20px;
    }
    .logo-section h1 {
        font-size: 32px;
        background: linear-gradient(90deg, #0088ff, #64ffda);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 900;
        letter-spacing: 2px;
    }
    .logo-section p { color: #64a0c8; font-size: 12px; letter-spacing: 4px; text-transform: uppercase; }

    /* Онлайн */
    .online-bar {
        margin: 0 20px;
        background: linear-gradient(90deg, #112240, #1e3a5f);
        padding: 12px 20px;
        border-radius: 12px;
        display: flex; justify-content: space-between; align-items: center;
        border: 1px solid #1e3a5f;
    }
    .online-left { display: flex; align-items: center; gap: 8px; color: #64ffda; font-size: 13px; font-weight: 600; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 10px #00ff88; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .online-count { font-size: 15px; font-weight: 800; color: #00d4ff; }

    /* Контент */
    .content { flex: 1; padding: 20px; }
    h2 { font-size: 18px; color: #00d4ff; margin-bottom: 12px; text-shadow: 0 0 10px rgba(0,212,255,0.4); }

    /* Карточки подарков */
    .deal-card {
        background: rgba(30, 58, 95, 0.4);
        border-radius: 12px; padding: 12px;
        border-left: 4px solid #00d4ff;
        margin-bottom: 10px;
        display: flex; gap: 12px; align-items: center;
    }
    .deal-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
    .deal-info { flex: 1; }
    .deal-title { font-size: 13px; font-weight: 600; color: #fff; }
    .deal-price { color: #64ffda; font-size: 15px; font-weight: bold; }
    .deal-date { font-size: 10px; color: #64a0c8; }
    .empty-text { color: #64a0c8; text-align: center; margin-top: 20px; }
</style>
</head>
<body>

    <!-- Профиль и звёзды -->
    <div class="top-panel">
        <div class="profile-mini">
            <img id="userAvatar" class="avatar" src="">
            <div>
                <h3 id="userName">Загрузка...</h3>
                <p id="userTag">@username</p>
            </div>
        </div>
        <div class="stars-badge">⭐ <span id="userBalance">0</span></div>
    </div>

    <!-- Логотип Telegram -->
    <div class="logo-section">
        <h1>Telegram</h1>
        <p>Premium Shop</p>
    </div>

    <!-- Онлайн -->
    <div class="online-bar">
        <div class="online-left">
            <div class="online-dot"></div>
            <span>Онлайн</span>
        </div>
        <div class="online-count"><span id="onlineCount">0</span> 👤</div>
    </div>

    <!-- Контент -->
    <div class="content">
        <h2>📦 Проданные подарки</h2>
        <div id="dealsList">
            <p class="empty-text">Загрузка...</p>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        // --- Онлайн по времени суток ---
        // Утро (6-11): 100-400
        // День (12-17): 400-800
        // Вечер (18-23): 800-1500
        // Ночь (0-5): 200-500
        let currentOnline = 0;
        const onlineEl = document.getElementById('onlineCount');

        function getBaseOnline() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 12) return 100 + Math.floor(Math.random() * 300);
            if (hour >= 12 && hour < 18) return 400 + Math.floor(Math.random() * 400);
            if (hour >= 18 && hour < 24) return 800 + Math.floor(Math.random() * 700);
            return 200 + Math.floor(Math.random() * 300);
        }

        currentOnline = getBaseOnline();
        onlineEl.textContent = currentOnline;

        // Плавное изменение каждые 5 сек
        setInterval(() => {
            const delta = Math.floor(Math.random() * 7) - 3; // -3..+3
            currentOnline += delta;
            
            const hour = new Date().getHours();
            let min, max;
            if (hour >= 6 && hour < 12) { min = 100; max = 400; }
            else if (hour >= 12 && hour < 18) { min = 400; max = 800; }
            else if (hour >= 18 && hour < 24) { min = 800; max = 1500; }
            else { min = 200; max = 500; }

            if (currentOnline < min) currentOnline = min;
            if (currentOnline > max) currentOnline = max;

            onlineEl.textContent = currentOnline;
        }, 5000);

        // --- Профиль ---
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userName').textContent = user.first_name || 'Пользователь';
            document.getElementById('userTag').textContent = user.username ? '@' + user.username : 'Нет юзернейма';
            if (user.photo_url) document.getElementById('userAvatar').src = user.photo_url;
        }

        // --- Проданные подарки (из URL или тестовые) ---
        const params = new URLSearchParams(window.location.search);
        const dealsList = document.getElementById('dealsList');

        // Если передан один чек (для теста) - показываем его. Иначе - "пока нет".
        const price = params.get('price');
        const gift = params.get('gift');
        const img = params.get('img');

        if (price && gift) {
            dealsList.innerHTML = `
                <div class="deal-card">
                    <img class="deal-img" src="${img || 'https://via.placeholder.com/50?text=🎁'}" alt="Подарок">
                    <div class="deal-info">
                        <div class="deal-title">Подарок продан</div>
                        <div class="deal-price">${price} звёзд</div>
                        <div class="deal-date">${new Date().toLocaleDateString()}</div>
                    </div>
                </div>
            `;
        } else {
            dealsList.innerHTML = '<p class="empty-text">Пока нет проданных подарков.</p>';
        }
    </script>
</body>
</html>
