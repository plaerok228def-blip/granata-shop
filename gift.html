<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подарок продан</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(circle at top, #1a3a6b 0%, #0a192f 70%);
        color: #e6f1ff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
    }

    .gift-image {
        width: 250px;
        height: 250px;
        border-radius: 24px;
        object-fit: cover;
        border: 4px solid #0088ff;
        box-shadow: 0 0 50px rgba(0, 136, 255, 0.6);
        margin-bottom: 30px;
        /* Анимация появления картинки */
        animation: popIn 0.8s ease-out;
    }

    @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .success-title {
        font-size: 26px;
        font-weight: 900;
        color: #00d4ff;
        margin-bottom: 15px;
        text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        animation: fadeUp 0.8s ease-out 0.2s both;
    }

    .success-price {
        font-size: 42px;
        font-weight: 900;
        color: #64ffda;
        margin-bottom: 25px;
        text-shadow: 0 0 20px rgba(100, 255, 218, 0.6);
        animation: fadeUp 0.8s ease-out 0.4s both;
    }

    .success-text {
        color: #b0c8e0;
        font-size: 15px;
        line-height: 1.6;
        max-width: 320px;
        animation: fadeUp 0.8s ease-out 0.6s both;
    }

    @keyframes fadeUp {
        0% { transform: translateY(20px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }
</style>
</head>
<body>

    <!-- Картинка подарка -->
    <img id="giftImage" class="gift-image" src="https://via.placeholder.com/250?text=NFT" alt="Подарок">
    
    <!-- Текст -->
    <div class="success-title">Ваш подарок успешно продан!</div>
    <div class="success-price" id="dealPrice">0 ⭐</div>
    <div class="success-text">
        После передачи подарка продавцу, звёзды будут зачислены на ваш аккаунт.
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const params = new URLSearchParams(window.location.search);
        const price = params.get('price') || '0';
        const giftLink = params.get('gift') || '';
        
        // Обновляем текст
        document.getElementById('dealPrice').textContent = price + ' ⭐';

        // Генерируем картинку-плейсхолдер с текстом, если ссылки на фото нет
        // В идеале тут можно попытаться вытащить og:image из t.me/nft/...
        // Но для простоты - ставим красивую заглушку
        if (giftLink && giftLink.includes('nft')) {
            // Здесь можно сделать fetch на парсинг og:image, но это сложно из-за CORS
            // Поэтому пока оставляем заглушку
            document.getElementById('giftImage').src = `https://via.placeholder.com/250/112240/64ffda?text=🎁`;
        }
    </script>
</body>
